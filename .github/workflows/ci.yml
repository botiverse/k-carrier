name: CI
on:
  push: { branches: ["**"] }
  pull_request:
  workflow_call:
permissions: { contents: read }
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - run: python scripts/check-docs.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features --no-fail-fast
      - name: Diagnose native controller lifetime on Windows
        if: failure() && runner.os == 'Windows'
        run: python scripts/diagnose-controller.py
      - run: python scripts/verify-native-examples.py
      - run: cargo run --locked --bin k-harness -- sim --seeds 256 --start-seed 1 --json
      - run: cargo package --locked
  musl-link:
    # Real link, not cargo check: musl's libc crate exports no renameat2
    # wrapper, so only a linked binary proves the quarantine syscall path.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Link the quarantine-carrying probe for x86_64-unknown-linux-musl
        # Real link, not cargo check: musl's libc crate exports no renameat2
        # wrapper, and dead-code elimination drops rename_exclusive from every
        # shipped bin, so only this probe retains the symbol and proves the
        # syscall path. Reverting to libc::renameat2 fails this step.
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --example musl-quarantine-probe
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned elan (standalone Lean model)
        shell: bash
        run: |
          curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: elan toolchain install leanprover/lean4:v4.34.0
      - run: elan run leanprover/lean4:v4.34.0 lean formal/Protocol.lean
