name: CI
on:
  push: { branches: ["main"] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    # Multi-platform from day 1: a POSIX assumption that leaks into core
    # should turn CI red the day it lands, not months later when the
    # abstraction has already grown around it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            required: true
          - os: macos-latest
            required: true
          # Windows platform ops are deliberately unimplemented (they throw
          # typed PLATFORM_UNSUPPORTED rather than approximating POSIX and
          # corrupting an install). This job therefore reports honestly but
          # does not gate: a permanently red required check teaches everyone
          # to ignore red, which costs more than the signal is worth. It flips
          # to required with the Windows milestone.
          - os: windows-latest
            required: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    name: check (${{ matrix.os }}${{ matrix.required && '' || ', informational — Windows ops not implemented yet' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm ratchet
      - run: pnpm test
