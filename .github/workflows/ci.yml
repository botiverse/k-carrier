name: CI
on:
  push: { branches: ["**"] }
  pull_request:
permissions: { contents: read }
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: python scripts/verify-native-examples.py
      - run: cargo run --locked --bin k-harness -- sim --seeds 256 --start-seed 1 --json
      - run: cargo package --locked
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned elan (standalone Lean model)
        shell: bash
        run: |
          curl -fsSL https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: elan toolchain install leanprover/lean4:v4.34.0
      - run: elan run leanprover/lean4:v4.34.0 lean formal/Protocol.lean
