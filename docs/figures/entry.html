<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the entry does next, by outcome</title>
<style>
:root {
  --ink: #111; --paper: #fffdf7; --soft: #f7f7f3; --muted: rgba(17,17,17,.52);
  --yellow: #ffe66b; --pink: #ff7aa2; --blue: #7bc8ff; --green: #98e59b;
  --orange: #ffb25f; --purple: #b7a1ff; --red: #ff7b73;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color-scheme: light; color: var(--ink); background: var(--paper);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1200px; height: 675px; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, rgba(17,17,17,.045) 1px, transparent 1.5px) 0 0 / 16px 16px, var(--paper); }
.frame svg { position: absolute; inset: 0; width: 1200px; height: 675px; }
text { font-family: inherit; fill: var(--ink); }
.h1 { font-size: 26px; font-weight: 700; }
.sub { font-size: 16px; fill: var(--muted); }
.lane { font-size: 16px; font-weight: 700; }
.laned { font-size: 13px; fill: var(--muted); }
.tb { font-size: 15px; font-weight: 700; }
.t { font-size: 13.5px; }
.tag { font-size: 12px; font-weight: 700; }
.code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; }
.box { stroke: var(--ink); stroke-width: 2.5; }
.shadow { fill: var(--ink); }
.line { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; }
.rail { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 3 5; }
.mark { stroke: var(--ink); stroke-width: 2; }
</style>
</head>
<body>
<div class="frame" id="frame" role="img" aria-label="Two lanes, interactive and non-interactive, showing what the entry does after each outcome. A channel without a version: interactive resolves it, shows the version and asks, then sends a new request with consent; non-interactive refuses. Held: interactive explains; non-interactive returns the code, the caller decides. Rolled back: interactive says why; non-interactive reports and never retries on its own. Unresolved: interactive prints the recovery file and runs recovery again; non-interactive keeps the file for the next invocation. Broken: interactive offers a repair on explicit consent, after which the machine is managed again; non-interactive reports broken and stops. Promoted: both report the live version, pid and start id.">
<svg viewBox="0 0 1200 675">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <text x="40" y="40" class="h1">What the entry does next, by outcome</text>
  <text x="40" y="64" class="sub">K returns the outcome. Whether to ask, what to say and whether to go again depend on who is present.</text>

  <!-- request node and return rail -->
  <g transform="translate(40,88)"><rect x="4" y="4" width="260" height="36" class="shadow"/><rect width="260" height="36" class="box" fill="var(--soft)"/><text x="130" y="24" text-anchor="middle" class="tb">Request: id, exact version, consent</text></g>
  <path d="M335 585 L335 106 L308 106" class="rail" marker-end="url(#a)"/>
  <text x="329" y="360" text-anchor="end" transform="rotate(-90 329 360)" class="laned">back to a new request</text>

  <!-- lane headers -->
  <text x="370" y="100" class="lane">Interactive</text><text x="370" y="118" class="laned">a person at the shell can be asked and can see the result</text>
  <text x="770" y="100" class="lane">Non-interactive</text><text x="770" y="118" class="laned">remote or scripted: never prompt, never assume</text>
  <line x1="370" y1="128" x2="1160" y2="128" class="line"/>

  <!-- rows -->
  <!-- r1 channel -->
  <g transform="translate(40,150)"><rect x="4" y="4" width="260" height="60" class="shadow"/><rect width="260" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="tb">A channel, not a version</text><text x="12" y="46" class="t">the request has to be pinned first</text></g>
  <g transform="translate(370,150)"><rect x="4" y="4" width="340" height="60" class="shadow"/><rect width="340" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Resolve it, show the version, ask.</text><text x="12" y="44" class="t">Consent goes into a new request.</text><rect x="246" y="36" width="84" height="18" class="mark" fill="var(--blue)"/><text x="288" y="49" text-anchor="middle" class="tag">new request</text></g>
  <line x1="368" y1="180" x2="337" y2="180" class="line"/>
  <g transform="translate(770,150)"><rect x="4" y="4" width="390" height="60" class="shadow"/><rect width="390" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Refuse. An exact version must be named.</text><text x="12" y="44" class="t">Nothing changes.</text><rect x="330" y="36" width="50" height="18" class="mark" fill="var(--red)"/><text x="355" y="49" text-anchor="middle" class="tag">stop</text></g>

  <!-- r2 held -->
  <g transform="translate(40,232)"><rect x="4" y="4" width="260" height="60" class="shadow"/><rect width="260" height="60" class="box" fill="var(--yellow)"/><text x="12" y="24" class="tb">Held</text><text x="230" y="26" class="code">2</text><text x="12" y="46" class="t">owner, compatibility or consent</text></g>
  <g transform="translate(370,232)"><rect x="4" y="4" width="340" height="60" class="shadow"/><rect width="340" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Explain the reason. Nothing changed;</text><text x="12" y="44" class="t">a new attempt is a new id.</text><rect x="280" y="36" width="50" height="18" class="mark" fill="var(--green)"/><text x="305" y="49" text-anchor="middle" class="tag">done</text></g>
  <g transform="translate(770,232)"><rect x="4" y="4" width="390" height="60" class="shadow"/><rect width="390" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Return the code and reason. The caller decides.</text><text x="12" y="44" class="t">No retry.</text><rect x="330" y="36" width="50" height="18" class="mark" fill="var(--red)"/><text x="355" y="49" text-anchor="middle" class="tag">stop</text></g>

  <!-- r3 rolled back -->
  <g transform="translate(40,314)"><rect x="4" y="4" width="260" height="60" class="shadow"/><rect width="260" height="60" class="box" fill="var(--red)"/><text x="12" y="24" class="tb">Rolled back</text><text x="230" y="26" class="code">1</text><text x="12" y="46" class="t">the candidate failed; stable is running</text></g>
  <g transform="translate(370,314)"><rect x="4" y="4" width="340" height="60" class="shadow"/><rect width="340" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Say why the candidate failed.</text><text x="12" y="44" class="t">The old version is running.</text><rect x="280" y="36" width="50" height="18" class="mark" fill="var(--green)"/><text x="305" y="49" text-anchor="middle" class="tag">done</text></g>
  <g transform="translate(770,314)"><rect x="4" y="4" width="390" height="60" class="shadow"/><rect width="390" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Report rolled-back.</text><text x="12" y="44" class="t">Never retry the same target on its own.</text><rect x="330" y="36" width="50" height="18" class="mark" fill="var(--red)"/><text x="355" y="49" text-anchor="middle" class="tag">stop</text></g>

  <!-- r4 unresolved -->
  <g transform="translate(40,396)"><rect x="4" y="4" width="260" height="60" class="shadow"/><rect width="260" height="60" class="box" fill="var(--orange)"/><text x="12" y="24" class="tb">Unresolved</text><text x="230" y="26" class="code">3</text><text x="12" y="46" class="t">recovery.json kept</text></g>
  <g transform="translate(370,396)"><rect x="4" y="4" width="340" height="60" class="shadow"/><rect width="340" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Print the recovery file and how to run it.</text><text x="12" y="44" class="t">Run recovery again.</text><rect x="236" y="36" width="94" height="18" class="mark" fill="var(--blue)"/><text x="283" y="49" text-anchor="middle" class="tag">recover again</text></g>
  <line x1="368" y1="426" x2="337" y2="426" class="line"/>
  <g transform="translate(770,396)"><rect x="4" y="4" width="390" height="60" class="shadow"/><rect width="390" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Keep the recovery file. The next invocation</text><text x="12" y="44" class="t">settles it first; no new work until then.</text><rect x="276" y="36" width="104" height="18" class="mark" fill="var(--blue)"/><text x="328" y="49" text-anchor="middle" class="tag">next invocation</text></g>

  <!-- r5 broken -->
  <g transform="translate(40,478)"><rect x="4" y="4" width="260" height="60" class="shadow"/><rect width="260" height="60" class="box" fill="var(--red)"/><text x="12" y="24" class="tb">Broken</text><text x="12" y="46" class="t">recovery cannot settle the machine</text></g>
  <g transform="translate(370,478)"><rect x="4" y="4" width="340" height="60" class="shadow"/><rect width="340" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Offer a repair; require explicit consent;</text><text x="12" y="44" class="t">report what was quarantined.</text><rect x="240" y="36" width="90" height="18" class="mark" fill="var(--yellow)"/><text x="285" y="49" text-anchor="middle" class="tag">managed again</text></g>
  <g transform="translate(770,478)"><rect x="4" y="4" width="390" height="60" class="shadow"/><rect width="390" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Report broken and stop. A repair is never</text><text x="12" y="44" class="t">started without a person present.</text><rect x="330" y="36" width="50" height="18" class="mark" fill="var(--red)"/><text x="355" y="49" text-anchor="middle" class="tag">stop</text></g>

  <!-- r6 promoted -->
  <g transform="translate(40,560)"><rect x="4" y="4" width="260" height="60" class="shadow"/><rect width="260" height="60" class="box" fill="var(--green)"/><text x="12" y="24" class="tb">Promoted</text><text x="230" y="26" class="code">0</text><text x="12" y="46" class="t">live readback confirmed</text></g>
  <g transform="translate(370,560)"><rect x="4" y="4" width="340" height="60" class="shadow"/><rect width="340" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Report the live version, pid and startId</text><text x="12" y="44" class="t">from the readback.</text><rect x="280" y="36" width="50" height="18" class="mark" fill="var(--green)"/><text x="305" y="49" text-anchor="middle" class="tag">done</text></g>
  <g transform="translate(770,560)"><rect x="4" y="4" width="390" height="60" class="shadow"/><rect width="390" height="60" class="box" fill="var(--paper)"/><text x="12" y="24" class="t">Same. Accepting the request</text><text x="12" y="44" class="t">was never success.</text><rect x="330" y="36" width="50" height="18" class="mark" fill="var(--green)"/><text x="355" y="49" text-anchor="middle" class="tag">done</text></g>
</svg>
</div>
<script>
const frame = document.getElementById('frame');
function fitFrame() {
  const scale = Math.min(1, window.innerWidth / 1200, window.innerHeight / 675);
  frame.style.transform = `scale(${scale})`;
  frame.style.transformOrigin = "top left";
}
fitFrame();
window.addEventListener("resize", fitFrame);
</script>
</body>
</html>
