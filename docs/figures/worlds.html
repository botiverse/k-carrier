<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What the installer does when it arrives</title>
<style>
:root {
  --ink: #111; --paper: #fffdf7; --soft: #f7f7f3; --muted: rgba(17,17,17,.52);
  --yellow: #ffe66b; --pink: #ff7aa2; --blue: #7bc8ff; --green: #98e59b;
  --orange: #ffb25f; --purple: #b7a1ff; --red: #ff7b73;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color-scheme: light; color: var(--ink); background: var(--paper);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1200px; height: 675px; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, rgba(17,17,17,.045) 1px, transparent 1.5px) 0 0 / 16px 16px, var(--paper); }
.frame svg { position: absolute; inset: 0; width: 1200px; height: 675px; }
text { font-family: inherit; fill: var(--ink); }
.h1 { font-size: 26px; font-weight: 700; }
.sub { font-size: 17px; fill: var(--muted); }
.q { font-size: 15px; font-weight: 700; }
.t { font-size: 15px; }
.tb { font-size: 15px; font-weight: 700; }
.d { font-size: 14px; fill: var(--muted); }
.lbl { font-size: 13px; font-weight: 700; }
.box { stroke: var(--ink); stroke-width: 2.5; }
.shadow { fill: var(--ink); }
.line { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.tag { stroke: var(--ink); stroke-width: 2; }
</style>
</head>
<body>
<div class="frame" id="frame" role="img" aria-label="A flowchart of what the installer does when it arrives at a machine. First, a machine still upgrading, with unfinished K work in the journal, has that work finished by K. Then: if a readable stable slot exists, the machine is managed and K runs its transaction. If not, an executable and service installed before K are adopted by seeding stable from them. If recovery ended unresolved or the state is corrupt, the machine is broken and is repaired only on explicit consent by quarantining the state and starting fresh. Otherwise the machine is fresh: download, verify, seed stable, start, probe. Every path ends in the managed world.">
<svg viewBox="0 0 1200 675">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <text x="40" y="44" class="h1">What the installer does when it arrives</text>
  <text x="40" y="70" class="sub">Five starting worlds, one destination: a machine K manages.</text>

  <!-- column 1: questions -->
  <g transform="translate(40,92)"><rect x="4" y="4" width="260" height="40" class="shadow"/><rect width="260" height="40" class="box" fill="var(--soft)"/><text x="130" y="26" text-anchor="middle" class="tb">The installer arrives</text></g>

  <g transform="translate(40,160)"><polygon points="4,34 34,4 234,4 264,34 234,64 34,64" class="shadow"/><polygon points="0,30 30,0 230,0 260,30 230,60 30,60" class="box" fill="var(--paper)"/><text x="130" y="28" text-anchor="middle" class="q">Unfinished K work</text><text x="130" y="46" text-anchor="middle" class="q">in the journal?</text></g>

  <g transform="translate(40,270)"><polygon points="4,34 34,4 234,4 264,34 234,64 34,64" class="shadow"/><polygon points="0,30 30,0 230,0 260,30 230,60 30,60" class="box" fill="var(--paper)"/><text x="130" y="36" text-anchor="middle" class="q">A readable stable slot?</text></g>

  <g transform="translate(40,380)"><polygon points="4,34 34,4 234,4 264,34 234,64 34,64" class="shadow"/><polygon points="0,30 30,0 230,0 260,30 230,60 30,60" class="box" fill="var(--paper)"/><text x="130" y="28" text-anchor="middle" class="q">An executable and service</text><text x="130" y="46" text-anchor="middle" class="q">installed before K?</text></g>

  <g transform="translate(40,490)"><polygon points="4,34 34,4 234,4 264,34 234,64 34,64" class="shadow"/><polygon points="0,30 30,0 230,0 260,30 230,60 30,60" class="box" fill="var(--paper)"/><text x="130" y="28" text-anchor="middle" class="q">Unresolved recovery, a corrupt</text><text x="130" y="46" text-anchor="middle" class="q">slot, a dead lock owner?</text></g>

  <!-- Fresh -->
  <g transform="translate(40,590)"><rect x="4" y="4" width="260" height="70" class="shadow"/><rect width="260" height="70" class="box" fill="var(--paper)"/><text x="12" y="24" class="tb">Fresh</text><text x="12" y="44" class="t">download and verify the release,</text><text x="12" y="62" class="t">bootstrapStable, start, probe</text></g>

  <!-- column 1 vertical flow -->
  <line x1="170" y1="136" x2="170" y2="158" class="line" marker-end="url(#a)"/>
  <line x1="170" y1="224" x2="170" y2="268" class="line" marker-end="url(#a)"/><text x="160" y="240" text-anchor="end" class="lbl">no</text>
  <line x1="170" y1="334" x2="170" y2="378" class="line" marker-end="url(#a)"/><text x="180" y="360" class="lbl">no</text>
  <line x1="170" y1="444" x2="170" y2="488" class="line" marker-end="url(#a)"/><text x="180" y="470" class="lbl">no</text>
  <line x1="170" y1="554" x2="170" y2="588" class="line" marker-end="url(#a)"/><text x="180" y="576" class="lbl">no: nothing is there</text>

  <!-- column 2: actions -->
  <g transform="translate(370,160)"><rect x="4" y="4" width="265" height="60" class="shadow"/><rect width="265" height="60" class="box" fill="var(--soft)"/><text x="12" y="24" class="tb">Upgrading</text><text x="12" y="44" class="t">K finishes it first: restore or replay</text></g>
  <line x1="304" y1="190" x2="368" y2="190" class="line" marker-end="url(#a)"/><text x="336" y="182" text-anchor="middle" class="lbl">yes</text>
  <path d="M502 224 L502 246 L170 246" class="line"/><text x="330" y="240" text-anchor="middle" class="d">then continue, with a settled journal</text>

  <g transform="translate(370,380)"><rect x="4" y="4" width="265" height="60" class="shadow"/><rect width="265" height="60" class="box" fill="var(--blue)"/><text x="12" y="24" class="tb">Adopted</text><text x="12" y="44" class="t">bootstrapStable from the executable</text></g>
  <line x1="304" y1="410" x2="368" y2="410" class="line" marker-end="url(#a)"/><text x="336" y="402" text-anchor="middle" class="lbl">yes</text>
  <line x1="639" y1="410" x2="688" y2="410" class="line" marker-end="url(#a)"/>

  <g transform="translate(370,490)"><rect x="4" y="4" width="265" height="74" class="shadow"/><rect width="265" height="74" class="box" fill="var(--red)"/><text x="12" y="24" class="tb">Broken</text><text x="12" y="44" class="t">repair only on explicit consent:</text><text x="12" y="62" class="t">quarantine the state, start fresh</text></g>
  <line x1="304" y1="520" x2="368" y2="520" class="line" marker-end="url(#a)"/><text x="336" y="512" text-anchor="middle" class="lbl">yes</text>
  <path d="M502 568 L502 614 L308 614" class="line" marker-end="url(#a)"/>
  <text x="512" y="600" class="d">no rollback, a receipt instead</text>

  <!-- column 3: managed -->
  <g transform="translate(690,270)"><rect x="8" y="8" width="470" height="200" class="shadow"/><rect width="470" height="200" class="box" fill="var(--yellow)" stroke-width="4"/>
    <text x="20" y="34" class="h1" style="font-size:22px">Managed</text>
    <text x="20" y="60" class="t">K's two-slot transaction: stage, quiesce, stop,</text>
    <text x="20" y="80" class="t">start the candidate, probe. Then promote,</text>
    <text x="20" y="100" class="t">or roll back to stable.</text>
    <rect x="20" y="120" width="164" height="28" class="tag" fill="var(--green)"/><text x="102" y="139" text-anchor="middle" class="tb">rollback guaranteed</text>
    <text x="20" y="180" class="d">The normal case, and where every other path ends.</text>
  </g>
  <line x1="304" y1="300" x2="688" y2="300" class="line" marker-end="url(#a)"/><text x="336" y="292" text-anchor="middle" class="lbl">yes</text>
  <path d="M304 640 L900 640 L900 480" class="line" marker-end="url(#a)"/>
  <text x="910" y="560" class="d">managed from now on</text>
</svg>
</div>
<script>
const frame = document.getElementById('frame');
function fitFrame() {
  const scale = Math.min(1, window.innerWidth / 1200, window.innerHeight / 675);
  frame.style.transform = `scale(${scale})`;
  frame.style.transformOrigin = "top left";
}
fitFrame();
window.addEventListener("resize", fitFrame);
</script>
</body>
</html>
