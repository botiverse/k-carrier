<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The four worlds an installer meets</title>
<style>
:root {
  --ink: #111; --paper: #fffdf7; --soft: #f7f7f3; --muted: rgba(17,17,17,.52);
  --yellow: #ffe66b; --pink: #ff7aa2; --blue: #7bc8ff; --green: #98e59b;
  --orange: #ffb25f; --purple: #b7a1ff; --red: #ff7b73;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color-scheme: light; color: var(--ink); background: var(--paper);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1200px; height: 675px; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, rgba(17,17,17,.045) 1px, transparent 1.5px) 0 0 / 16px 16px, var(--paper); }
.frame svg { position: absolute; inset: 0; width: 1200px; height: 675px; }
text { font-family: inherit; fill: var(--ink); }
.h1 { font-size: 26px; font-weight: 700; }
.sub { font-size: 18px; fill: var(--muted); }
.t { font-size: 22px; font-weight: 700; }
.d { font-size: 14.5px; fill: var(--muted); }
.a { font-size: 14.5px; }
.ab { font-size: 14.5px; font-weight: 700; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; }
.box { stroke: var(--ink); stroke-width: 2.5; }
.shadow { fill: var(--ink); }
.line { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.dash { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; }
.tag { stroke: var(--ink); stroke-width: 2; }
</style>
</head>
<body>
<div class="frame" id="frame" role="img" aria-label="A state diagram of the four worlds. Fresh, adopted and broken machines each enter the managed world through an installer action: download and bootstrap stable; bootstrap stable from the running executable; or, on consent, quarantine and reinstall. Inside the managed world K runs upgrades that end promoted or rolled back and stay managed. A machine leaves the managed world for broken only when recovery cannot settle it.">
<svg viewBox="0 0 1200 675">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <text x="40" y="52" class="h1">The four worlds an installer meets</text>
  <text x="40" y="82" class="sub">Three ways into the managed world, one way out of it. K owns only the loop inside.</text>

  <!-- Fresh -->
  <g transform="translate(40,130)">
    <rect x="6" y="6" width="330" height="110" class="shadow"/><rect width="330" height="110" class="box" fill="var(--paper)"/>
    <text x="18" y="36" class="t">Fresh</text>
    <text x="18" y="64" class="d">Nothing on the machine.</text>
    <text x="18" y="92" class="m">owner: installer</text>
  </g>
  <!-- Adopted -->
  <g transform="translate(40,290)">
    <rect x="6" y="6" width="330" height="110" class="shadow"/><rect width="330" height="110" class="box" fill="var(--blue)"/>
    <text x="18" y="36" class="t">Adopted</text>
    <text x="18" y="64" class="d">An executable and service installed before K.</text>
    <text x="18" y="84" class="d">No stable slot yet.</text>
    <text x="18" y="104" class="m">owner: installer, then K</text>
  </g>
  <!-- Broken -->
  <g transform="translate(40,480)">
    <rect x="6" y="6" width="330" height="140" class="shadow"/><rect width="330" height="140" class="box" fill="var(--red)"/>
    <text x="18" y="36" class="t">Broken</text>
    <text x="18" y="64" class="d">State K cannot settle: unresolved recovery,</text>
    <text x="18" y="84" class="d">a corrupt slot, a dead lock owner,</text>
    <text x="18" y="104" class="d">a missing executable.</text>
    <text x="18" y="128" class="m">owner: installer, on explicit consent</text>
  </g>

  <!-- Managed -->
  <g transform="translate(760,130)">
    <rect x="8" y="8" width="400" height="480" class="shadow"/><rect width="400" height="480" class="box" fill="var(--yellow)" stroke-width="4"/>
    <text x="22" y="40" class="t">Managed</text>
    <text x="22" y="68" class="d">A complete stable slot and a settled journal.</text>
    <text x="22" y="88" class="d">Every invocation settles unfinished work first.</text>
    <text x="22" y="118" class="m">owner: K</text>
    <!-- the K loop -->
    <rect x="22" y="140" width="356" height="300" class="box" fill="var(--paper)"/>
    <text x="40" y="170" class="ab">K's two-slot transaction</text>
    <text x="40" y="192" class="d">stage, quiesce, stop, start, probe</text>
    <g transform="translate(40,215)"><rect x="4" y="4" width="130" height="44" class="shadow"/><rect width="130" height="44" class="box" fill="var(--paper)"/><text x="65" y="28" text-anchor="middle" class="m">upgrade</text></g>
    <g transform="translate(228,215)"><rect x="4" y="4" width="130" height="44" class="shadow"/><rect width="130" height="44" class="box" fill="var(--green)"/><text x="65" y="28" text-anchor="middle" class="m">promoted</text></g>
    <g transform="translate(228,290)"><rect x="4" y="4" width="130" height="44" class="shadow"/><rect width="130" height="44" class="box" fill="var(--red)"/><text x="65" y="28" text-anchor="middle" class="m">rolled-back</text></g>
    <line x1="174" y1="237" x2="224" y2="237" class="line" marker-end="url(#a)"/>
    <path d="M174 237 L200 237 L200 312 L224 312" class="line" marker-end="url(#a)"/>
    <!-- both return to managed -->
    <path d="M293 344 L293 372 L105 372 L105 266" class="line" marker-end="url(#a)"/>
    <text x="118" y="394" class="d">both outcomes stay managed</text>
    <rect x="40" y="406" width="150" height="28" class="tag" fill="var(--green)"/><text x="115" y="425" text-anchor="middle" class="ab">rollback guaranteed</text>
  </g>

  <!-- arrows into managed -->
  <line x1="376" y1="196" x2="754" y2="196" class="line" marker-end="url(#a)"/>
  <text x="565" y="152" text-anchor="middle" class="ab">installer</text>
  <text x="565" y="172" text-anchor="middle" class="a">download and verify the release,</text>
  <text x="565" y="222" text-anchor="middle" class="a">bootstrapStable, start, probe</text>
  <rect x="490" y="234" width="150" height="24" class="tag" fill="var(--paper)"/><text x="565" y="251" text-anchor="middle" class="m">verified + probed</text>

  <line x1="376" y1="356" x2="754" y2="356" class="line" marker-end="url(#a)"/>
  <text x="565" y="312" text-anchor="middle" class="ab">installer</text>
  <text x="565" y="332" text-anchor="middle" class="a">bootstrapStable from the running</text>
  <text x="565" y="382" text-anchor="middle" class="a">executable, then a normal upgrade</text>
  <rect x="490" y="394" width="150" height="24" class="tag" fill="var(--paper)"/><text x="565" y="411" text-anchor="middle" class="m">verified + probed</text>

  <line x1="376" y1="548" x2="754" y2="548" class="line" marker-end="url(#a)"/>
  <text x="565" y="486" text-anchor="middle" class="ab">installer, on consent: repair</text>
  <text x="565" y="506" text-anchor="middle" class="a">quarantine the state directory, reinstall</text>
  <text x="565" y="524" text-anchor="middle" class="a">from a trusted release, bootstrapStable</text>
  <rect x="440" y="560" width="250" height="24" class="tag" fill="var(--paper)"/><text x="565" y="577" text-anchor="middle" class="m">consent + receipt, no rollback</text>

  <!-- managed -> broken -->
  <path d="M900 619 L900 648 L205 648 L205 632" class="dash" marker-end="url(#a)"/>
  <text x="560" y="668" text-anchor="middle" class="d">the only way out of managed: recovery cannot settle the machine</text>
</svg>
</div>
<script>
const frame = document.getElementById('frame');
function fitFrame() {
  const scale = Math.min(1, window.innerWidth / 1200, window.innerHeight / 675);
  frame.style.transform = `scale(${scale})`;
  frame.style.transformOrigin = "top left";
}
fitFrame();
window.addEventListener("resize", fitFrame);
</script>
</body>
</html>
