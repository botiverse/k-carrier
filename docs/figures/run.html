<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One run, whatever the entry</title>
<style>
:root { --ink: #111; --paper: #fffdf7; --muted: rgba(17,17,17,.55); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color-scheme: light; color: var(--ink); background: var(--paper);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1200px; height: 600px; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, rgba(17,17,17,.045) 1px, transparent 1.5px) 0 0 / 16px 16px, var(--paper); }
.frame svg { position: absolute; inset: 0; width: 1200px; height: 600px; }
text { font-family: inherit; fill: var(--ink); }
.h1 { font-size: 26px; font-weight: 700; }
.sub { font-size: 17px; fill: var(--muted); }
.t { font-size: 16px; }
.tb { font-size: 17px; font-weight: 700; }
.d { font-size: 14px; fill: var(--muted); }
.box { stroke: var(--ink); stroke-width: 2.5; }
.shadow { fill: var(--ink); }
.line { stroke: var(--ink); stroke-width: 2.5; fill: none; }
.lbl { font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
<div class="frame" id="frame" role="img" aria-label="Seven gates every installer run passes in order: presence, lock, settle, read the world, resolve and verify, act, read back and report. Each gate names what it refuses and the exit code: unattended without version and consent refuses with 2, another live lock owner is held with 2, unsettleable work is unresolved with 3, a machine another manager owns is held with 2, any verification mismatch fails before any change with 1, a candidate failing the probe is rolled back with 1, and only a live readback is promoted with 0.">
<svg viewBox="0 0 1200 600">
  <g transform="translate(0,-75)">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>
  <text x="700" y="100" class="d">if not</text>
  <rect x="44" y="122" width="600" height="62" class="shadow"/><rect x="40" y="118" width="600" height="62" fill="#fff" class="box"/>
  <text x="58" y="146" class="tb">1. Presence</text>
  <text x="58" y="168" class="d">decide once: CI or *_NON_INTERACTIVE=1, else a tty. Unattended never asks</text>
  <path d="M640 149 L690 149" class="line"/>
  <rect x="700" y="126" width="460" height="46" fill="#ffb7b7" stroke="rgba(17,17,17,.6)" stroke-width="1.5"/>
  <text x="714" y="148" class="t">no version named, authority unreachable</text>
  <text x="1148" y="148" text-anchor="end" class="lbl">failed before any change · 1</text>
  <path d="M340 180 L340 194" class="line" marker-end="url(#a)"/>
  <rect x="44" y="198" width="600" height="62" class="shadow"/><rect x="40" y="194" width="600" height="62" fill="#fff" class="box"/>
  <text x="58" y="222" class="tb">2. Lock</text>
  <text x="58" y="244" class="d">one installer per state directory; never reclaimed by age</text>
  <path d="M640 225 L690 225" class="line"/>
  <rect x="700" y="202" width="460" height="46" fill="#ffe66b" stroke="rgba(17,17,17,.6)" stroke-width="1.5"/>
  <text x="714" y="224" class="t">another live owner</text>
  <text x="1148" y="224" text-anchor="end" class="lbl">held · 2</text>
  <path d="M340 256 L340 270" class="line" marker-end="url(#a)"/>
  <rect x="44" y="274" width="600" height="62" class="shadow"/><rect x="40" y="270" width="600" height="62" fill="#fff" class="box"/>
  <text x="58" y="298" class="tb">3. Settle</text>
  <text x="58" y="320" class="d">finish unfinished K work: restore or replay, and say so</text>
  <path d="M640 301 L690 301" class="line"/>
  <rect x="700" y="278" width="460" height="46" fill="#ffb7b7" stroke="rgba(17,17,17,.6)" stroke-width="1.5"/>
  <text x="714" y="300" class="t">cannot settle</text>
  <text x="1148" y="300" text-anchor="end" class="lbl">unresolved · 3</text>
  <path d="M340 332 L340 346" class="line" marker-end="url(#a)"/>
  <rect x="44" y="350" width="600" height="62" class="shadow"/><rect x="40" y="346" width="600" height="62" fill="#fff" class="box"/>
  <text x="58" y="374" class="tb">4. Read the world</text>
  <text x="58" y="396" class="d">fresh · adopted · managed · broken; then ask the product: running? what next?</text>
  <path d="M640 377 L690 377" class="line"/>
  <rect x="700" y="354" width="460" height="46" fill="#ffe66b" stroke="rgba(17,17,17,.6)" stroke-width="1.5"/>
  <text x="714" y="376" class="t">owned by another manager</text>
  <text x="1148" y="376" text-anchor="end" class="lbl">held · 2</text>
  <path d="M340 408 L340 422" class="line" marker-end="url(#a)"/>
  <rect x="44" y="426" width="600" height="62" class="shadow"/><rect x="40" y="422" width="600" height="62" fill="#fff" class="box"/>
  <text x="58" y="450" class="tb">5. Resolve and verify</text>
  <text x="58" y="472" class="d">authority and CDN agree; bytes hashed; platform and self-reported version match</text>
  <path d="M640 453 L690 453" class="line"/>
  <rect x="700" y="430" width="460" height="46" fill="#ffb7b7" stroke="rgba(17,17,17,.6)" stroke-width="1.5"/>
  <text x="714" y="452" class="t">any mismatch</text>
  <text x="1148" y="452" text-anchor="end" class="lbl">failed before any change · 1</text>
  <path d="M340 484 L340 498" class="line" marker-end="url(#a)"/>
  <rect x="44" y="502" width="600" height="62" class="shadow"/><rect x="40" y="498" width="600" height="62" fill="#fff" class="box"/>
  <text x="58" y="526" class="tb">6. Act</text>
  <text x="58" y="548" class="d">install + first setup · adopt then upgrade · K transaction · repair</text>
  <path d="M640 529 L690 529" class="line"/>
  <rect x="700" y="506" width="460" height="46" fill="#ffb7b7" stroke="rgba(17,17,17,.6)" stroke-width="1.5"/>
  <text x="714" y="528" class="t">candidate fails the probe</text>
  <text x="1148" y="528" text-anchor="end" class="lbl">rolled back · 1</text>
  <path d="M340 560 L340 574" class="line" marker-end="url(#a)"/>
  <rect x="44" y="578" width="600" height="62" class="shadow"/><rect x="40" y="574" width="600" height="62" fill="#98e59b" class="box"/>
  <text x="58" y="602" class="tb">7. Read back and report</text>
  <text x="58" y="624" class="d">a process of the new bytes answers: the live service, or the candidate itself</text>
  <path d="M640 605 L690 605" class="line"/>
  <rect x="700" y="582" width="460" height="46" fill="#f0efe9" stroke="rgba(17,17,17,.6)" stroke-width="1.5"/>
  <text x="714" y="604" class="t">acceptance is never success</text>
  <text x="1148" y="604" text-anchor="end" class="lbl">promoted · 0</text>
  </g>
</svg>
</div>
<script>
const frame = document.getElementById('frame');
function fitFrame() {
  const scale = Math.min(1, window.innerWidth / 1200, window.innerHeight / 600);
  frame.style.transform = `scale(${scale})`;
  frame.style.transformOrigin = "top left";
}
fitFrame();
window.addEventListener("resize", fitFrame);
</script>
</body>
</html>
