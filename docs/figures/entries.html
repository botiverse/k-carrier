<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What each entry means, by machine condition</title>
<style>
:root {
  --ink: #111; --paper: #fffdf7; --soft: #f7f7f3; --muted: rgba(17,17,17,.52);
  --yellow: #ffe66b; --pink: #ff7aa2; --blue: #7bc8ff; --green: #98e59b;
  --orange: #ffb25f; --purple: #b7a1ff; --red: #ff7b73;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color-scheme: light; color: var(--ink); background: var(--paper);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.frame { position: relative; width: 1200px; height: 675px; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, rgba(17,17,17,.045) 1px, transparent 1.5px) 0 0 / 16px 16px, var(--paper); }
.frame svg { position: absolute; inset: 0; width: 1200px; height: 675px; }
text { font-family: inherit; fill: var(--ink); }
.h1 { font-size: 26px; font-weight: 700; }
.sub { font-size: 17px; fill: var(--muted); }
.ch { font-size: 15px; font-weight: 700; }
.tb { font-size: 16px; font-weight: 700; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; }
.t { font-size: 13.5px; }
.d { font-size: 13.5px; fill: var(--muted); }
.tag { font-size: 12px; font-weight: 700; }
.box { stroke: var(--ink); stroke-width: 2.5; }
.shadow { fill: var(--ink); }
.na { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
.mark { stroke: var(--ink); stroke-width: 2; }
</style>
</head>
<body>
<div class="frame" id="frame" role="img" aria-label="A three-by-three grid: the entries install.sh, self upgrade and remote authority against the machine conditions nothing installed, application running and application cannot start. install.sh installs a fresh machine. On a running machine it should say what will happen and ask, then upgrades or rolls back to an exact version with the installer outside the application's service unit, and may offer a repair on explicit consent. On a machine that cannot start it may repair on explicit request, reporting a receipt instead of a rollback. self upgrade needs a running application: it resolves the channel to an exact version, shows it and asks, then becomes install.sh. A remote authority is unreachable unless the application runs; it must pin an exact version, record the approver, never prompt and never repair, and claims success only from the receipt and the live readback.">
<svg viewBox="0 0 1200 675">
  <text x="40" y="44" class="h1">What each entry means, by machine condition</text>
  <text x="40" y="70" class="sub">One installer underneath. What the entry owes around it depends on who is present and what the machine is doing.</text>

  <!-- column headers -->
  <text x="400" y="112" text-anchor="middle" class="ch">Nothing installed</text>
  <text x="700" y="112" text-anchor="middle" class="ch">The application is running</text>
  <text x="1000" y="112" text-anchor="middle" class="ch">The application cannot start</text>

  <!-- row 1: install.sh -->
  <g transform="translate(40,130)"><rect x="4" y="4" width="200" height="155" class="shadow"/><rect width="200" height="155" class="box" fill="var(--soft)"/><text x="14" y="34" class="m">install.sh</text><text x="14" y="58" class="d">a person at the shell</text></g>

  <g transform="translate(260,130)"><rect x="4" y="4" width="280" height="155" class="shadow"/><rect width="280" height="155" class="box" fill="var(--paper)"/>
    <text x="12" y="28" class="t">Installs. Downloads and verifies</text>
    <text x="12" y="46" class="t">the bytes, seeds stable, starts and</text>
    <text x="12" y="64" class="t">probes.</text>
    <rect x="12" y="126" width="62" height="18" class="mark" fill="var(--blue)"/><text x="43" y="139" text-anchor="middle" class="tag">install</text>
  </g>

  <g transform="translate(560,130)"><rect x="4" y="4" width="280" height="155" class="shadow"/><rect width="280" height="155" class="box" fill="var(--yellow)"/>
    <text x="12" y="24" class="t">SHOULD say what will happen and ask</text>
    <text x="12" y="42" class="t">first. Upgrades or rolls back to an</text>
    <text x="12" y="60" class="t">exact version. The installer runs</text>
    <text x="12" y="78" class="t">outside the app's service unit.</text>
    <text x="12" y="96" class="t">Repair MAY be offered, explicit</text>
    <text x="12" y="114" class="t">consent only.</text>
    <rect x="12" y="126" width="68" height="18" class="mark" fill="var(--green)"/><text x="46" y="139" text-anchor="middle" class="tag">upgrade</text>
    <rect x="88" y="126" width="74" height="18" class="mark" fill="var(--soft)"/><text x="125" y="139" text-anchor="middle" class="tag">rollback</text>
  </g>

  <g transform="translate(860,130)"><rect x="4" y="4" width="280" height="155" class="shadow"/><rect width="280" height="155" class="box" fill="var(--paper)"/>
    <text x="12" y="28" class="t">MAY repair, on explicit request only:</text>
    <text x="12" y="46" class="t">quarantine the state, reinstall</text>
    <text x="12" y="64" class="t">verified bytes, bootstrapStable.</text>
    <text x="12" y="82" class="t">Reports a repair: a receipt, never</text>
    <text x="12" y="100" class="t">a rollback.</text>
    <rect x="12" y="126" width="126" height="18" class="mark" fill="var(--yellow)"/><text x="75" y="139" text-anchor="middle" class="tag">repair on consent</text>
  </g>

  <!-- row 2: self upgrade -->
  <g transform="translate(40,300)"><rect x="4" y="4" width="200" height="155" class="shadow"/><rect width="200" height="155" class="box" fill="var(--soft)"/><text x="14" y="34" class="m">self upgrade</text><text x="14" y="58" class="d">a command inside the app</text></g>

  <g transform="translate(260,300)"><rect width="280" height="155" class="na"/><text x="140" y="82" text-anchor="middle" class="d">Nothing to run it from.</text></g>

  <g transform="translate(560,300)"><rect x="4" y="4" width="280" height="155" class="shadow"/><rect width="280" height="155" class="box" fill="var(--paper)"/>
    <text x="12" y="28" class="t">SHOULD resolve the channel to an</text>
    <text x="12" y="46" class="t">exact version, show it and ask. Then</text>
    <text x="12" y="64" class="t">it is install.sh: the same bootstrap,</text>
    <text x="12" y="82" class="t">a pinned installer.</text>
    <rect x="12" y="126" width="96" height="18" class="mark" fill="var(--blue)"/><text x="60" y="139" text-anchor="middle" class="tag">= install.sh</text>
  </g>

  <g transform="translate(860,300)"><rect width="280" height="155" class="na"/><text x="140" y="74" text-anchor="middle" class="d">The app cannot start;</text><text x="140" y="92" text-anchor="middle" class="d">the command cannot run.</text></g>

  <!-- row 3: remote authority -->
  <g transform="translate(40,470)"><rect x="4" y="4" width="200" height="155" class="shadow"/><rect width="200" height="155" class="box" fill="var(--soft)"/><text x="14" y="34" class="tb">remote authority</text><text x="14" y="58" class="d">through the running app</text></g>

  <g transform="translate(260,470)"><rect width="280" height="155" class="na"/><text x="140" y="82" text-anchor="middle" class="d">Unreachable.</text></g>

  <g transform="translate(560,470)"><rect x="4" y="4" width="280" height="155" class="shadow"/><rect width="280" height="155" class="box" fill="var(--paper)"/>
    <text x="12" y="28" class="t">MUST pin an exact version and record</text>
    <text x="12" y="46" class="t">the approver. NEVER prompts, NEVER</text>
    <text x="12" y="64" class="t">repairs. Success is claimed only from</text>
    <text x="12" y="82" class="t">the receipt and the live readback.</text>
    <rect x="12" y="126" width="68" height="18" class="mark" fill="var(--green)"/><text x="46" y="139" text-anchor="middle" class="tag">upgrade</text>
    <rect x="88" y="126" width="74" height="18" class="mark" fill="var(--soft)"/><text x="125" y="139" text-anchor="middle" class="tag">rollback</text>
  </g>

  <g transform="translate(860,470)"><rect width="280" height="155" class="na"/><text x="140" y="82" text-anchor="middle" class="d">Unreachable.</text></g>

  <text x="40" y="660" class="d">The farther the approver is from the machine, the narrower the action. Every permitted path launches the same installer and the same transaction.</text>
</svg>
</div>
<script>
const frame = document.getElementById('frame');
function fitFrame() {
  const scale = Math.min(1, window.innerWidth / 1200, window.innerHeight / 675);
  frame.style.transform = `scale(${scale})`;
  frame.style.transformOrigin = "top left";
}
fitFrame();
window.addEventListener("resize", fitFrame);
</script>
</body>
</html>
